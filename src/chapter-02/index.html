<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 2 - Contact Form</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 px-4 py-8 sm:px-6 sm:py-12">
  <main class="mx-auto w-full max-w-lg">
    <h1 class="mb-6 text-center text-2xl font-bold text-gray-900 sm:mb-8 sm:text-3xl">
      Contact Us
    </h1>

    <form
      id="contact-form"
      class="rounded-lg bg-white p-6 shadow-md sm:p-8"
      novalidate
    >
      <div class="mb-4 sm:mb-6">
        <label for="name" class="mb-1 block text-sm font-medium text-gray-700">
          Name
        </label>
        <input
          type="text"
          id="name"
          name="name"
          required
          autocomplete="name"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-base text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div class="mb-4 sm:mb-6">
        <label for="email" class="mb-1 block text-sm font-medium text-gray-700">
          Email
        </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-base text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div class="mb-6 sm:mb-8">
        <label for="message" class="mb-1 block text-sm font-medium text-gray-700">
          Message
        </label>
        <textarea
          id="message"
          name="message"
          rows="5"
          required
          class="w-full resize-y rounded-md border border-gray-300 px-3 py-2 text-base text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full rounded-md bg-blue-500 px-4 py-2 text-base font-semibold text-white hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 sm:w-auto"
      >
        Send Message
      </button>
    </form>
  </main>

  <script src="./contact-form.js"></script>
</body>
</html>
