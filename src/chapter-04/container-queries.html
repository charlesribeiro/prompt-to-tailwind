<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../../dist/output.css" rel="stylesheet">
  <title>Chapter 4 - Container Queries Demo</title>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-8">
  <h1 class="text-2xl font-bold mb-6">Container Queries Demo</h1>
  <p class="mb-8 text-gray-600 max-w-2xl">
    Resize your browser window to see how this card adapts based on its container size, not the viewport.
  </p>

  <div class="@container/card rounded-lg border border-gray-200 shadow-md">
    <div class="flex flex-col @[32rem]/card:flex-row">
      <img
        src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
        alt="Ergonomic mechanical keyboard on desk with RGB lighting"
        class="aspect-[4/3] w-full object-cover @[32rem]/card:w-48 @[32rem]/card:aspect-square"
      />
      <div class="flex flex-col p-4">
        <h3 class="text-lg font-semibold text-gray-800">Ergonomic Keyboard</h3>
        <p class="mt-2 text-sm text-gray-600">
          A high-quality mechanical keyboard designed for comfort and productivity.
        </p>
        <button class="mt-4 ml-auto rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition-colors">
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</body>
</html>
