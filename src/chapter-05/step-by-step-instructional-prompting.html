<html>
  <head>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-gray-100">
<div x-data="{ isOpen: false }">
  <button @click="isOpen = true" class="px-4 py-2 text-white bg-indigo-600 rounded-md">Open Modal</button>

  <div
    x-show="isOpen"
    style="display: none;"
    x-trap="isOpen"
    @keydown.escape.window="isOpen = false"
    class="fixed inset-0 z-50 overflow-y-auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div
      x-show="isOpen"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black bg-opacity-50"
      @click="isOpen = false"
    ></div>

    <div
      x-show="isOpen"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 scale-95"
      x-transition:enter-end="opacity-100 scale-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 scale-100"
      x-transition:leave-end="opacity-0 scale-95"
      class="relative w-full max-w-md p-6 mx-auto my-8 bg-white rounded-lg shadow-xl"
    >
      <h2 id="modal-title" class="text-2xl font-bold text-gray-900">Modal Title</h2>
      <p class="mt-2 text-gray-600">
        This is the content of the modal. Focus is trapped inside, and you can close it by clicking the button, the backdrop, or pressing the Escape key.
      </p>
      <div class="mt-6 text-right">
        <button @click="isOpen = false" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
  </body>
</html>
