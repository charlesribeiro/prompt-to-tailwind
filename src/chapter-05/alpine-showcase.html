<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine.js Directives Showcase</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="p-10 bg-gray-100">

  <div x-data="{ isSelected: false, statusText: 'Click to Activate' }" class="text-center">

    <button @click="isSelected = !isSelected; statusText = isSelected ? 'Active' : 'Inactive'"
      :class="isSelected ? 'bg-green-600' : 'bg-blue-600'"
      class="rounded-lg px-6 py-2 font-medium text-white shadow-md transition-all hover:opacity-90">
      <span x-text="statusText"></span>
    </button>

    <p x-show="isSelected" class="mt-4 text-green-700 font-semibold" style="display: none;">
      The logic is working!
    </p>

  </div>
</body>

</html>
