<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scaffolding Prompting - cn() Utility Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "clsx": "https://esm.sh/clsx@2.1.0",
      "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1"
    }
  }
  </script>

  <script type="text/babel" data-type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { clsx } from 'clsx';
    import { twMerge } from 'tailwind-merge';

    // Utility function: cn() - Combines clsx and tailwind-merge
    function cn(...inputs) {
      return twMerge(clsx(inputs));
    }

    // Button component using the cn() utility
    function Button({ isPrimary, isDisabled, className, children }) {
      const buttonClasses = cn(
        'px-4 py-2 rounded font-semibold transition-colors', // Base classes
        {
          'bg-blue-500 text-white hover:bg-blue-600': isPrimary && !isDisabled,
          'bg-gray-200 text-gray-800': !isPrimary && !isDisabled,
          'bg-gray-100 text-gray-400 cursor-not-allowed': isDisabled,
        },
        className // Allow overriding with external classes
      );

      return <button className={buttonClasses} disabled={isDisabled}>{children}</button>;
    }

    function App() {
      return (
        <div className="w-full max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
          <h1 className="text-3xl font-bold text-gray-900 mb-2">Scaffolding Prompting Demo</h1>
          <p className="text-gray-600 mb-6">
            The <code className="px-2 py-1 bg-gray-100 rounded text-sm">cn()</code> utility combines{' '}
            <code className="px-2 py-1 bg-gray-100 rounded text-sm">clsx</code> and{' '}
            <code className="px-2 py-1 bg-gray-100 rounded text-sm">tailwind-merge</code> for flexible class management.
          </p>

          <div className="space-y-6">
            {/* Primary Buttons */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Primary Buttons</h2>
              <div className="flex flex-wrap gap-3">
                <Button isPrimary={true}>Primary Button</Button>
                <Button isPrimary={true} isDisabled={true}>Disabled Primary</Button>
                <Button isPrimary={true} className="shadow-lg">Custom Shadow</Button>
              </div>
            </div>

            {/* Secondary Buttons */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Secondary Buttons</h2>
              <div className="flex flex-wrap gap-3">
                <Button isPrimary={false}>Secondary Button</Button>
                <Button isPrimary={false} isDisabled={true}>Disabled Secondary</Button>
                <Button isPrimary={false} className="border border-gray-300">With Border</Button>
              </div>
            </div>

            {/* Code Example */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">The cn() Utility</h2>
              <pre className="bg-gray-900 text-gray-100 p-4 rounded-md text-sm overflow-x-auto">
                <code>{`import { clsx } from "clsx";
import { twMerge } from "tailwind-merge";

export function cn(...inputs) {
  return twMerge(clsx(inputs));
}

// Usage:
const buttonClasses = cn(
  'px-4 py-2 rounded', // Base
  { 'bg-blue-500': isPrimary }, // Conditional
  className // Override
);`}</code>
              </pre>
            </div>

            {/* Benefits */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Benefits</h2>
              <ul className="list-disc list-inside text-gray-600 space-y-2">
                <li><strong>clsx:</strong> Conditional class names with clean syntax</li>
                <li><strong>tailwind-merge:</strong> Intelligently merges conflicting Tailwind classes</li>
                <li><strong>Type-safe:</strong> Works great with TypeScript</li>
                <li><strong>Flexible:</strong> Allows component users to override styles</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
