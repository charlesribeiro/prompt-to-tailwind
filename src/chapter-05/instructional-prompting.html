<html>
  <head>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div x-data="{ isOpen: false }" class="p-8 bg-gray-100 rounded-lg">
      <button
        @click="isOpen = !isOpen"
        class="px-4 py-2 font-semibold text-white bg-blue-600 rounded-md"
      >
        Toggle Content
      </button>

      <div
        x-show="isOpen"
        x-transition
        class="p-4 mt-4 bg-white border rounded-md"
      >
        <p class="text-gray-700">This content can be shown or hidden!</p>
      </div>
    </div>
  </body>
</html>
