<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persona-Based Prompting - CVA Pattern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "clsx": "https://esm.sh/clsx@2.1.0",
      "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
      "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.0"
    }
  }
  </script>

  <script type="text/babel" data-type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { clsx } from 'clsx';
    import { twMerge } from 'tailwind-merge';
    import { cva } from 'class-variance-authority';

    // Utility function: cn()
    function cn(...inputs) {
      return twMerge(clsx(inputs));
    }

    // Define button variants using CVA
    const buttonVariants = cva(
      // Base classes applied to all variants
      "inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none",
      {
        variants: {
          variant: {
            primary: "bg-blue-600 text-white hover:bg-blue-600/90",
            secondary: "bg-gray-200 text-gray-900 hover:bg-gray-200/80",
            destructive: "bg-red-600 text-white hover:bg-red-600/90",
            outline: "border border-gray-300 bg-white hover:bg-gray-100",
          },
          size: {
            sm: "h-9 px-3",
            md: "h-10 px-4 py-2",
            lg: "h-11 px-8",
          },
        },
        defaultVariants: {
          variant: "primary",
          size: "md",
        },
      }
    );

    // Button component using forwardRef
    const Button = React.forwardRef(
      ({ className, variant, size, ...props }, ref) => {
        return (
          <button
            className={cn(buttonVariants({ variant, size, className }))}
            ref={ref}
            {...props}
          />
        );
      }
    );
    Button.displayName = "Button";

    function App() {
      return (
        <div className="w-full max-w-3xl mx-auto bg-white rounded-lg shadow-md p-8">
          <h1 className="text-3xl font-bold text-gray-900 mb-2">Persona-Based Prompting Demo</h1>
          <p className="text-gray-600 mb-6">
            Using <code className="px-2 py-1 bg-gray-100 rounded text-sm">class-variance-authority</code> (CVA)
            to create type-safe, variant-driven components.
          </p>

          <div className="space-y-6">
            {/* Primary Variants */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Primary Variant</h2>
              <div className="flex flex-wrap gap-3">
                <Button variant="primary" size="sm">Small</Button>
                <Button variant="primary" size="md">Medium</Button>
                <Button variant="primary" size="lg">Large</Button>
                <Button variant="primary" disabled>Disabled</Button>
              </div>
            </div>

            {/* Secondary Variants */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Secondary Variant</h2>
              <div className="flex flex-wrap gap-3">
                <Button variant="secondary" size="sm">Small</Button>
                <Button variant="secondary" size="md">Medium</Button>
                <Button variant="secondary" size="lg">Large</Button>
                <Button variant="secondary" disabled>Disabled</Button>
              </div>
            </div>

            {/* Destructive Variants */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Destructive Variant</h2>
              <div className="flex flex-wrap gap-3">
                <Button variant="destructive" size="sm">Delete</Button>
                <Button variant="destructive" size="md">Remove</Button>
                <Button variant="destructive" size="lg">Destroy</Button>
              </div>
            </div>

            {/* Outline Variants */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Outline Variant</h2>
              <div className="flex flex-wrap gap-3">
                <Button variant="outline" size="sm">Cancel</Button>
                <Button variant="outline" size="md">Reset</Button>
                <Button variant="outline" size="lg">Clear</Button>
              </div>
            </div>

            {/* Code Example */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">CVA Pattern</h2>
              <pre className="bg-gray-900 text-gray-100 p-4 rounded-md text-sm overflow-x-auto">
                <code>{`const buttonVariants = cva(
  "base classes here",
  {
    variants: {
      variant: {
        primary: "bg-blue-600 text-white",
        secondary: "bg-gray-200 text-gray-900",
      },
      size: {
        sm: "h-9 px-3",
        md: "h-10 px-4 py-2",
      },
    },
    defaultVariants: {
      variant: "primary",
      size: "md",
    },
  }
);

// Usage:
<Button variant="primary" size="lg">
  Click Me
</Button>`}</code>
              </pre>
            </div>

            {/* Benefits */}
            <div className="border-t pt-6">
              <h2 className="text-lg font-semibold text-gray-800 mb-3">Benefits of CVA</h2>
              <ul className="list-disc list-inside text-gray-600 space-y-2">
                <li><strong>Type-safe:</strong> Full TypeScript support with autocomplete</li>
                <li><strong>Composable:</strong> Mix and match variant dimensions</li>
                <li><strong>Default values:</strong> Sensible defaults with easy overrides</li>
                <li><strong>Scalable:</strong> Add new variants without touching existing code</li>
                <li><strong>DX-focused:</strong> Clean API for component consumers</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
